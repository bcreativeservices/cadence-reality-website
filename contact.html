<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact – Cadence Realty</title>

    <!-- Global Styles -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/contact.css">
</head>

<body>

    <!-- Inject Global Header -->
    <div id="header-placeholder"></div>

    <!-- Hero -->
    <section class="contact-hero">
        <h1 class="contact-title">Get in Touch</h1>
        <p class="contact-subtitle">We’re here to help you every step of the way.</p>
    </section>

    <!-- Sticky CTA Button -->
    <button class="cta-button" id="ctaButton">
        Call Us
    </button>

    <!-- Contact Details -->
    <section class="contact-details contact-section">
        <h2>Contact Information</h2>

        <p><strong>Phone:</strong> (832) 222‑9000</p>
        <p><strong>Email:</strong> info@cadencerealty.com</p>

        <p>
            <strong>Office:</strong><br>
            22762 Westheimer Pkwy, Suite 420<br>
            Katy, TX 77450
        </p>
    </section>

    <!-- Contact Form -->
    <section class="contact-form-section contact-section">
        <h2>Send Us a Message</h2>

        <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">

            <!-- Web3Forms Access Key -->
            <input type="hidden" name="access_key" value="0b752324-af5d-4cf2-9720-dbc8faf81596">

            <!-- Honeypot (spam protection) -->
            <input type="checkbox" name="botcheck" style="display:none;">

            <div class="form-field">
                <input type="text" id="name" name="name" required>
                <label for="name">Full Name</label>
            </div>

            <div class="form-field">
                <input type="email" id="email" name="email" required>
                <label for="email">Email Address</label>
            </div>

            <div class="form-field">
                <input type="tel" id="phone" name="phone">
                <label for="phone">Phone Number (optional)</label>
            </div>

            <div class="form-field">
                <textarea id="message" name="message" rows="5" required></textarea>
                <label for="message">Your Message</label>
            </div>

            <button type="submit" class="submit-button">
                Send Message
            </button>

            <!-- Success Message -->
            <p class="form-success" id="formSuccess">Your message has been sent!</p>

            <!-- Error Message -->
            <p class="form-error" id="formError">Something went wrong. Please try again.</p>

        </form>
    </section>

    <!-- Inject Global Footer -->
    <div id="footer-placeholder"></div>

    <!-- Component Loader -->
    <script src="components/includes.js"></script>

    <!-- Luxury Motion System -->
    <script src="js/scroll-animations.js"></script>

    <!-- Micro-Interactions Library -->
    <script src="js/micro-interactions.js"></script>

    <!-- Web3Forms Submission Handler -->
    <script>
    document.querySelector(".contact-form").addEventListener("submit", async function(e) {
        e.preventDefault();

        const form = e.target;
        const formData = new FormData(form);

        const response = await fetch(form.action, {
            method: form.method,
            body: formData
        });

        if (response.ok) {
            document.getElementById("formSuccess").style.display = "block";
            form.reset();
        } else {
            document.getElementById("formError").style.display = "block";
        }
    });
    </script>

    <!-- Sticky CTA Behavior -->
    <script>
    document.addEventListener("DOMContentLoaded", () => {

        const cta = document.getElementById("ctaButton");
        let lastScroll = 0;

        // Soft pulse on load
        setTimeout(() => {
            cta.classList.add("cta-pulse");
            setTimeout(() => cta.classList.remove("cta-pulse"), 3000);
        }, 800);

        // Hide CTA when scrolling down, show when scrolling up
        window.addEventListener("scroll", () => {
            const currentScroll = window.pageYOffset;

            if (currentScroll > lastScroll) {
                cta.classList.add("cta-hidden");
            } else {
                cta.classList.remove("cta-hidden");
            }

            lastScroll = currentScroll;
        });

        // Actual click-to-call
        cta.addEventListener("click", () => {
            window.location.href = "tel:+18322229000";
        });

    });
    </script>

</body>
</html>

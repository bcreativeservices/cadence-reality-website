name: Update Sales Stats

# Keeps data/stats.json current for the About page's stat counters.
# See scripts/fetch-stats.js for what this actually does and why.

on:
  schedule:
    - cron: "0 */4 * * *" # every 4 hours — more automatic chances at HAR's inconsistent bot protection, still considerate of their servers (6 attempts/day, not a hammering frequency)
  workflow_dispatch: {} # allows manually running this from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest stats
        run: node scripts/fetch-stats.js

      - name: Commit and push if changed
        run: |
          git config user.name "cadence-stats-bot"
          git config user.email "actions@github.com"
          git add data/stats.json
          git diff --staged --quiet || git commit -m "Update sales stats [automated]"
          git push

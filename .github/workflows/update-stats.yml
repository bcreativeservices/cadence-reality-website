name: Update Sales Stats

# Keeps data/stats.json current for the About page's stat counters.
# See scripts/fetch-stats.js for what this actually does and why.
#
# RETIRED as the source of truth (see about.html's fetch chain and
# stats-dashboard.html): the numbers are now entered manually through the
# StatsDashboard admin page. The automatic schedule below is turned off
# rather than deleted, since this was hard-failing (red X) whenever HAR
# returned zero matches, which happened often enough to be noise once the
# feature it supported was being replaced anyway. Still runnable manually
# from the Actions tab if ever useful again.

on:
  workflow_dispatch: {} # allows manually running this from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest stats
        run: node scripts/fetch-stats.js

      - name: Commit and push if changed
        run: |
          git config user.name "cadence-stats-bot"
          git config user.email "actions@github.com"
          git add data/stats.json
          git diff --staged --quiet || git commit -m "Update sales stats [automated]"
          git push
